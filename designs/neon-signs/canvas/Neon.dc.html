<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Neon wall sign</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070605}
.nr{color:var(--core);filter:drop-shadow(0 0 1.5px var(--neon)) drop-shadow(0 0 6px var(--neon)) drop-shadow(0 0 18px var(--neon)) drop-shadow(0 0 40px var(--neon))}
.no{color:var(--core2);filter:drop-shadow(0 0 1.5px var(--neon2)) drop-shadow(0 0 6px var(--neon2)) drop-shadow(0 0 16px var(--neon2)) drop-shadow(0 0 34px var(--neon2))}
.outline{color:transparent;-webkit-text-stroke:3px var(--core)}
.svgr{stroke:var(--core)}
.hum{animation:hum 4s infinite}
.flick{animation:flick 6s infinite}
.flick2{animation:flick2 12s infinite}
.blink{animation:blink 1.5s infinite}
.chase{animation:chase 1.5s infinite}
.c2{animation-delay:-1s}
.c3{animation-delay:-0.5s}
.dying{animation:dying 12s infinite}
.still,.still *{animation:none !important}
@keyframes hum{0%,100%{opacity:1}50%{opacity:.93}}
@keyframes flick{0%,40%{opacity:1}41%{opacity:.2}42%{opacity:1}43.5%{opacity:.25}45%,100%{opacity:1}}
@keyframes flick2{0%,70%{opacity:1}70.5%{opacity:.3}71.5%{opacity:.9}72%,74%{opacity:.2}75%,100%{opacity:1}}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.12}}
@keyframes chase{0%,32%{opacity:1}34%,100%{opacity:.12}}
@keyframes dying{0%,20%{opacity:.18}21%{opacity:1}22%,50%{opacity:.18}51%{opacity:.9}52.5%{opacity:.2}53%,56%{opacity:1}57%,100%{opacity:.18}}
@media (prefers-reduced-motion: reduce){.hum,.flick,.flick2,.blink,.chase,.dying{animation:none}}
</style>
</helmet>
<div class="{{rootClass}}" style="--neon: {{neon}}; --core: {{core}}; --neon2: #F6853D; --core2: #FFE4CF; position: relative; width: 1400px; height: 1000px; overflow: hidden; background: radial-gradient(ellipse 62% 58% at 50% 48%, {{spill}} 0%, rgba(0,0,0,0) 72%), repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 175px), #070605; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">

<div style="position: absolute; left: 88px; top: 84px; width: 1224px; height: 832px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; background: rgba(255,255,255,0.012); padding: 58px 76px 54px; display: flex; flex-direction: column">

<div style="position: absolute; left: 20px; top: 20px; width: 16px; height: 16px; border-radius: 50%; background: #484848; border: 2px solid rgba(0,0,0,0.6)"></div>
<div style="position: absolute; right: 20px; top: 20px; width: 16px; height: 16px; border-radius: 50%; background: #484848; border: 2px solid rgba(0,0,0,0.6)"></div>
<div style="position: absolute; left: 20px; bottom: 20px; width: 16px; height: 16px; border-radius: 50%; background: #484848; border: 2px solid rgba(0,0,0,0.6)"></div>
<div style="position: absolute; right: 20px; bottom: 20px; width: 16px; height: 16px; border-radius: 50%; background: #484848; border: 2px solid rgba(0,0,0,0.6)"></div>

<div class="nr outline hum" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 112px; line-height: 1; letter-spacing: -0.035em; white-space: nowrap">Eastman Film Lab</div>

<div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px">
<div class="no flick" style="font-weight: 300; font-size: 40px; letter-spacing: 0.01em">film develop service</div>
<div class="nr hum" style="font-weight: 400; font-size: 24px; letter-spacing: 0.22em">35mm · 120 · C-41 · E-6 · B&amp;W</div>
</div>

<div class="nr" style="height: 3px; border-radius: 3px; background: var(--core); margin: 30px 0 34px"></div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) 210px; column-gap: 56px; align-items: start">

<div style="display: flex; flex-direction: column; gap: 6px">
<div class="nr hum" style="font-weight: 300; font-size: 74px; line-height: 1.15">필름 현상</div>
<div class="nr hum" style="font-weight: 300; font-size: 74px; line-height: 1.15">스<span class="dying">캔</span> · 인화</div>
<div class="no" style="font-weight: 400; font-size: 22px; letter-spacing: 0.2em; margin-top: 14px; white-space: nowrap">DEVELOP · SCAN · PRINT</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding-top: 6px">
<div class="no" style="font-weight: 400; font-size: 20px; letter-spacing: 0.3em; margin-bottom: 4px">PRICE 가격</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 300; font-size: 32px">
<span class="nr">C-41 컬러</span><span class="no">6.0</span>
</div>
<div class="flick2" style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 300; font-size: 32px">
<span class="nr">B&amp;W 흑백</span><span class="no">10.0</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 300; font-size: 32px">
<span class="nr">E-6 슬라이드</span><span class="no">15.0</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 300; font-size: 32px">
<span class="nr">120 중형필름</span><span class="no">10.0</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 300; font-size: 32px">
<span class="nr">PRINT 인화</span><span class="no">0.4 –</span>
</div>
</div>

<div style="padding-top: 8px">
<svg class="nr hum" width="210" height="200" viewBox="0 0 240 228" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<rect class="svgr" x="60" y="6" width="46" height="24" rx="5"></rect>
<rect class="svgr" x="18" y="30" width="130" height="16" rx="6"></rect>
<rect class="svgr" x="26" y="46" width="114" height="136"></rect>
<rect class="svgr" x="18" y="182" width="130" height="16" rx="6"></rect>
<path class="svgr" d="M26 92 H140 M26 138 H140"></path>
<path class="svgr" d="M140 66 H214 L230 96 V150 H140"></path>
<path class="svgr" d="M154 76 h8 v8 h-8 z M176 76 h8 v8 h-8 z M198 76 h8 v8 h-8 z M154 132 h8 v8 h-8 z M176 132 h8 v8 h-8 z M198 132 h8 v8 h-8 z"></path>
</svg>
<div class="no" style="font-weight: 400; font-size: 20px; letter-spacing: 0.16em; text-align: center; margin-top: 18px; white-space: nowrap">@EASTMAN_LAB</div>
</div>

</div>

<div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto">
<div class="nr blink" style="border: 3px solid var(--core); border-radius: 12px; padding: 4px 24px 8px; font-weight: 400; font-size: 54px; letter-spacing: 0.14em; line-height: 1.2">OPEN</div>
<div style="display: flex; align-items: center; gap: 22px; margin-right: 8px">
<span class="no" style="font-weight: 300; font-size: 38px; white-space: nowrap">첫 방문이신가요?</span>
<span style="display: flex; gap: 4px">
<svg class="nr chase" width="22" height="36" viewBox="0 0 22 36" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="svgr" d="M4 4 L18 18 L4 32"></path></svg>
<svg class="nr chase c2" width="22" height="36" viewBox="0 0 22 36" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="svgr" d="M4 4 L18 18 L4 32"></path></svg>
<svg class="nr chase c3" width="22" height="36" viewBox="0 0 22 36" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="svgr" d="M4 4 L18 18 L4 32"></path></svg>
</span>
<span class="nr" style="font-weight: 300; font-size: 38px; white-space: nowrap">카카오채널 이스트만랩</span>
</div>
</div>

</div>

<svg width="140" height="120" viewBox="0 0 140 120" fill="none" aria-hidden="true" style="position: absolute; left: 1230px; top: 880px">
<path d="M60 36 C 60 70, 110 70, 104 124" stroke="#1c1c1c" stroke-width="7" stroke-linecap="round"></path>
</svg>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"neon":{"editor":"color","options":["#FF5A2C","#F6853D","#FF7A3D"],"default":"#FF5A2C"},"animate":{"editor":"boolean","default":true},"$preview":{"width":1400,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const neon = this.props.neon ?? '#FF5A2C';
    const h = neon.replace('#', '');
    const rgb = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) || 0);
    const core = 'rgb(' + rgb.map((c) => Math.round(c + (255 - c) * 0.72)).join(',') + ')';
    return {
      neon,
      core,
      spill: 'rgba(' + rgb.join(',') + ',0.16)',
      rootClass: (this.props.animate ?? true) ? '' : 'still'
    };
  }
}
</script>
</body>
</html>
