<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LED sign — 35mm frame</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
</style>
</helmet>
<div style="width: 800px; height: 1000px; background: #000000; overflow: hidden">
<canvas data-led="1" ref="{{setCanvas}}" role="img" aria-label="Animated multicolor LED sign shaped like a 35mm film frame, hanging from a wall bracket at night" style="width: 800px; height: 1000px; display: block"></canvas>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"shape":{"editor":"enum","options":["frame","aperture","canister"],"default":"frame"},"palette":{"editor":"enum","options":["rave","brand"],"default":"rave"},"program":{"editor":"enum","options":["loop","wordmark","countdown","tunnel","roll3d","equalizer","iris","kaleido","filmstrip","e3d","lightleak","burst","korean","clock","strobe"],"default":"loop"},"bpm":{"editor":"int","min":90,"max":160,"default":128},"speed":{"editor":"range","min":0.25,"max":2,"step":0.05,"default":1},"glow":{"editor":"boolean","default":true},"$preview":{"width":800,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    if (!this._sc) this._sc = (el) => { if (el) this.canvas = el; };
    return { setCanvas: this._sc };
  }

  componentDidMount() {
    this.DEF = 'frame';
    this.SANS = '"Helvetica Neue", Helvetica, Arial, sans-serif';
    this.KR = '"Noto Sans KR", "Apple SD Gothic Neo", sans-serif';
    this.t = 0; this.last = 0; this.dt = 0.016; this.cache = {}; this.fontsOk = false;
    this.parts = []; this.peaks = []; this.lastBeat = -1; this._o = { v: 0, c: 0 };
    const ok = () => { this.fontsOk = true; this.cache = {}; this._ce = null; };
    if (document.fonts && document.fonts.load) {
      document.fonts.load('900 24px "Noto Sans KR"', '현상스캔인화').then(ok, ok);
    } else ok();
    const loop = (ts) => { this.raf = requestAnimationFrame(loop); try { this.frame(ts); } catch (e) {} };
    this.raf = requestAnimationFrame(loop);
  }

  componentWillUnmount() { cancelAnimationFrame(this.raf); }

  frame(ts) {
    const cv = this.canvas || document.querySelector('canvas[data-led]');
    if (!cv) return;
    const W = 800, H = 1000;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const dt = this.last ? Math.min(0.1, (ts - this.last) / 1000) : 0.016;
    this.last = ts;
    const speed = this.props.speed ?? 1;
    this.dt = dt * speed;
    this.t += this.dt;
    const pal = this.props.palette ?? 'rave';
    if (pal !== this.palKey) { this.palKey = pal; this.lut = this.makeLut(pal); }
    const shape = this.props.shape ?? this.DEF;
    if (!this.sign || this.sign.shape !== shape) this.sign = this.makeSign(shape);
    const S = this.sign;
    const k = Math.exp(-this.dt * 12);
    for (let i = 0; i < S.buf.length; i++) S.buf[i] *= k;
    this.runProgram(S, this.t);
    this.draw(cv.getContext('2d'), W, H, dpr, S);
  }

  makeLut(pal) {
    const P = pal === 'brand'
      ? [[246, 133, 61]]
      : [[246, 133, 61], [255, 194, 26], [43, 217, 107], [34, 200, 240], [122, 92, 255], [255, 61, 168]];
    const L = [];
    for (let s = 0; s < 36; s++) {
      const f = s / 36 * P.length, i = Math.floor(f), u = f - i, a = P[i % P.length], b = P[(i + 1) % P.length];
      L.push([0, 1, 2].map((k) => Math.round(a[k] + (b[k] - a[k]) * u)));
    }
    return L;
  }

  makeSign(shape) {
    let gw, gh, img, m;
    if (shape === 'aperture') {
      gw = 48; gh = 48; m = new Uint8Array(gw * gh);
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
        const d = Math.hypot(x - 23.5, y - 23.5);
        m[y * gw + x] = d <= 23.9 ? (d > 22.4 ? 2 : 1) : 0;
      }
      img = { x0: 0, y0: 0, x1: gw, y1: gh };
    } else if (shape === 'canister') {
      gw = 36; gh = 54; m = new Uint8Array(gw * gh);
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
        let v;
        if (y < 6) v = (x >= 12 && x <= 23) ? (y < 2 ? 2 : 1) : 0;
        else if (y <= 8 || y >= gh - 3) v = 2;
        else v = (x >= 1 && x <= gw - 2) ? 1 : 0;
        if (v && (y === 6 || y === gh - 1) && (x === 0 || x === gw - 1)) v = 0;
        m[y * gw + x] = v;
      }
      img = { x0: 1, y0: 9, x1: gw - 1, y1: gh - 3 };
    } else {
      shape = 'frame'; gw = 57; gh = 40; m = new Uint8Array(gw * gh);
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
        let v = 1;
        if (y <= 4 || y >= gh - 5) {
          v = 2;
          const holeRow = (y >= 1 && y <= 3) || (y >= gh - 4 && y <= gh - 2);
          if (holeRow && x >= 2 && x <= 54 && (x - 2) % 7 <= 3) v = 0;
        }
        m[y * gw + x] = v;
      }
      img = { x0: 0, y0: 5, x1: gw, y1: gh - 5 };
    }
    return { shape, gw, gh, mask: m, img, buf: new Float32Array(gw * gh), col: new Float32Array(gw * gh) };
  }

  runProgram(S, t) {
    const P = [['wordmark', 5], ['countdown', 4], ['tunnel', 5], ['roll3d', 5], ['equalizer', 5], ['iris', 4], ['kaleido', 5], ['filmstrip', 4], ['e3d', 5], ['lightleak', 5], ['burst', 4], ['korean', 6], ['clock', 4], ['strobe', 2.4]];
    const pin = this.props.program ?? 'loop';
    let fx = P[0][0], d = P[0][1], lt = 0;
    if (pin !== 'loop') {
      const e = P.find((p) => p[0] === pin) || P[0];
      fx = e[0]; d = e[1]; lt = t % d;
    } else {
      const total = P.reduce((a, p) => a + p[1], 0);
      let r = t % total;
      for (const p of P) { if (r < p[1]) { fx = p[0]; d = p[1]; lt = r; break; } r -= p[1]; }
    }
    const b = t * (this.props.bpm ?? 128) / 60;
    this.B = { n: Math.floor(b), pulse: Math.pow(1 - (b % 1), 3) };
    this['fx_' + fx](S, lt, d);
    if (fx !== 'strobe') this.chase(S, t);
    if (pin === 'loop' && lt < 0.12 && fx !== 'countdown') {
      const f = 1 - lt / 0.12;
      for (let i = 0; i < S.buf.length; i++) {
        if (S.mask[i] && f > S.buf[i]) { S.buf[i] = f; S.col[i] = (i % S.gw) / S.gw; }
      }
    }
  }

  geo(S) {
    const g = S.img, iw = g.x1 - g.x0, ih = g.y1 - g.y0;
    return { x0: g.x0, y0: g.y0, iw, ih, cx: g.x0 + (iw - 1) / 2, cy: g.y0 + (ih - 1) / 2, R: Math.min(iw, ih) / 2 };
  }

  put(S, x, y, v, c) {
    const g = S.img;
    if (x < g.x0 || y < g.y0 || x >= g.x1 || y >= g.y1) return;
    const i = y * S.gw + x;
    if (S.mask[i] && S.buf[i] < v) { S.buf[i] = v; S.col[i] = c || 0; }
  }

  each(S, fn) {
    const g = S.img, o = this._o;
    for (let y = g.y0; y < g.y1; y++) for (let x = g.x0; x < g.x1; x++) {
      const i = y * S.gw + x;
      if (!S.mask[i]) continue;
      o.v = 0; o.c = 0;
      fn(x, y, o);
      if (o.v > S.buf[i]) { S.buf[i] = o.v; S.col[i] = o.c; }
    }
  }

  chase(S, t) {
    const step = Math.floor(t * 14);
    for (let y = 0; y < S.gh; y++) for (let x = 0; x < S.gw; x++) {
      const i = y * S.gw + x;
      if (S.mask[i] !== 2) continue;
      let v, c;
      if (S.shape === 'aperture') {
        const a = Math.floor((Math.atan2(y - 23.5, x - 23.5) + Math.PI) / (2 * Math.PI) * 48);
        v = (((a - step) % 6) + 6) % 6 === 0 ? 1 : 0.22;
        c = a / 48 + t * 0.2;
      } else {
        const pos = y < S.gh / 2 ? x - step : x + step;
        v = ((pos % 7) + 7) % 7 === 0 ? 1 : 0.22;
        c = x / S.gw + t * 0.2;
      }
      if (v > S.buf[i]) { S.buf[i] = v; S.col[i] = c; }
    }
  }

  textMask(str, px, family, weight, spacing) {
    const key = str + '|' + px + '|' + family + '|' + weight;
    if (this.cache[key]) return this.cache[key];
    const cv = document.createElement('canvas');
    let ctx = cv.getContext('2d');
    const font = weight + ' ' + px + 'px ' + family;
    ctx.font = font;
    if (spacing) ctx.letterSpacing = spacing;
    const w = Math.ceil(ctx.measureText(str).width) + 4, h = Math.ceil(px * 1.5);
    cv.width = w; cv.height = h;
    ctx = cv.getContext('2d');
    ctx.font = font;
    if (spacing) ctx.letterSpacing = spacing;
    ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
    ctx.fillText(str, 2, h / 2);
    const a = ctx.getImageData(0, 0, w, h).data;
    const data = new Uint8Array(w * h);
    let top = h, bot = -1, left = w, right = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (a[(y * w + x) * 4 + 3] > 115) {
        data[y * w + x] = 1;
        if (y < top) top = y; if (y > bot) bot = y; if (x < left) left = x; if (x > right) right = x;
      }
    }
    const m = { w, h, data, top, bot, left, right };
    if (this.fontsOk) this.cache[key] = m;
    return m;
  }

  stamp(S, m, ox, oy, v, c) {
    for (let y = m.top; y <= m.bot; y++) for (let x = m.left; x <= m.right; x++) {
      if (!m.data[y * m.w + x]) continue;
      const gx = Math.round(ox + x - m.left), gy = Math.round(oy + y - m.top);
      this.put(S, gx, gy, v, typeof c === 'function' ? c(gx, gy) : c);
    }
  }

  stampC(S, m, cx, cy, v, c) {
    const tw = m.right - m.left + 1, th = m.bot - m.top + 1;
    this.stamp(S, m, Math.round(cx - (tw - 1) / 2), Math.round(cy - (th - 1) / 2), v, c);
  }

  scrollText(S, str, px, family, weight, spacing, lt, cps, v, c) {
    const g = this.geo(S);
    const m = this.textMask(str, px, family, weight, spacing);
    const tw = m.right - m.left + 1, th = m.bot - m.top + 1;
    const span = tw + g.iw + 6;
    const x = g.x0 + g.iw - Math.floor((lt * cps) % span);
    this.stamp(S, m, x, g.y0 + Math.round((g.ih - th) / 2), v, c);
  }

  fx_wordmark(S, lt) {
    const g = this.geo(S);
    this.scrollText(S, 'EASTMAN FILM LAB', Math.round(Math.min(g.ih * 0.72, 26)), this.SANS, 700, '-0.5px', lt, 24,
      0.7 + 0.3 * this.B.pulse, (x) => x * 0.02 - lt * 0.4);
  }

  fx_korean(S, lt) {
    const g = this.geo(S);
    this.scrollText(S, '현상 · 스캔 · 인화', Math.round(Math.min(g.ih * 0.72, 24)), this.KR, 900, null, lt, 20,
      0.7 + 0.3 * this.B.pulse, (x) => x * 0.03 + lt * 0.5);
  }

  fx_countdown(S, lt) {
    const g = this.geo(S);
    const n = 3 - Math.floor(lt);
    if (n <= 0) {
      const f = Math.max(0, 1 - (lt - 3) * 1.4);
      this.each(S, (x, y, o) => { o.v = f; o.c = (x + y) * 0.02; });
      return;
    }
    const p = lt % 1, R = g.R - 0.5, TAU = Math.PI * 2, sweepC = (3 - n) * 0.34 + 0.17;
    this.each(S, (x, y, o) => {
      const dx = x - g.cx, dy = y - g.cy, d = Math.hypot(dx, dy);
      const a = (Math.atan2(dx, -dy) + TAU) % TAU;
      if (Math.abs(d - R * 0.92) < 0.7 || Math.abs(d - R * 0.72) < 0.6) { o.v = 0.9; return; }
      if (Math.abs(dx) <= 0.5 || Math.abs(dy) <= 0.5) { o.v = 0.5; return; }
      if (d < R * 0.92 && a < p * TAU) { o.v = 0.4; o.c = sweepC; }
    });
    this.stampC(S, this.textMask(String(n), Math.round(R * 1.1), this.SANS, 700), g.cx, g.cy, 1, 0);
  }

  render3d(S, P, ang, tilt, sc, oy, cfn) {
    const g = this.geo(S), N = S.gw * S.gh;
    if (!this._zb || this._zb.length !== N) { this._zb = new Float32Array(N); this._vb = new Float32Array(N); this._cb = new Float32Array(N); }
    const zb = this._zb, vb = this._vb, cb2 = this._cb;
    zb.fill(1e9); vb.fill(0);
    const ca = Math.cos(ang), sa = Math.sin(ang), cb = Math.cos(tilt), sb = Math.sin(tilt);
    const L0 = -0.44, L1 = -0.54, L2 = -0.72;
    for (let q = 0; q < P.length; q++) {
      const p = P[q];
      const x = p[0] * ca + p[2] * sa, z = -p[0] * sa + p[2] * ca;
      const y2 = p[1] * cb - z * sb, z2 = p[1] * sb + z * cb;
      const nx = p[3] * ca + p[5] * sa, nz = -p[3] * sa + p[5] * ca;
      const ny2 = p[4] * cb - nz * sb, nz2 = p[4] * sb + nz * cb;
      if (!p[7] && nz2 > 0.25) continue;
      const k = 4 / (4 + z2);
      const sx = Math.round(g.cx + x * sc * k), sy = Math.round(g.cy + oy + y2 * sc * k);
      if (sx < g.x0 || sy < g.y0 || sx >= g.x0 + g.iw || sy >= g.y0 + g.ih) continue;
      const i = sy * S.gw + sx;
      if (z2 >= zb[i]) continue;
      let dl = nx * L0 + ny2 * L1 + nz2 * L2;
      if (p[7]) dl = Math.abs(dl);
      zb[i] = z2; vb[i] = (0.16 + 0.84 * Math.max(0, dl)) * p[6]; cb2[i] = cfn(p, x, y2);
    }
    for (let i = 0; i < N; i++) {
      if (zb[i] < 1e9 && S.mask[i] && vb[i] > S.buf[i]) { S.buf[i] = vb[i]; S.col[i] = cb2[i]; }
    }
  }

  cloudCanister() {
    if (this._cc) return this._cc;
    const P = [], TAU = Math.PI * 2;
    for (let i = 0; i < 96; i++) {
      const a = i / 96 * TAU, c = Math.cos(a), s = Math.sin(a);
      for (let j = 0; j <= 44; j++) {
        const y = -1.1 + j * 0.05;
        P.push([c, y, s, c, 0, s, (y > -0.45 && y < 0.45 && a < 4.2) ? 1 : 0.55, 0]);
      }
      for (const y of [-1.1, -1.05, 1.05, 1.1]) P.push([1.06 * c, y, 1.06 * s, c, 0, s, 1, 0]);
    }
    for (let r = 0.05; r < 1; r += 0.07) {
      const n = Math.ceil(96 * r);
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU, c = Math.cos(a) * r, s = Math.sin(a) * r;
        P.push([c, -1.1, s, 0, -1, 0, 0.8, 0]);
        P.push([c, 1.1, s, 0, 1, 0, 0.8, 0]);
      }
    }
    for (let i = 0; i < 40; i++) {
      const a = i / 40 * TAU, c = Math.cos(a), s = Math.sin(a);
      for (let j = 0; j <= 6; j++) P.push([0.32 * c, -1.1 - j * 0.05, 0.32 * s, c, 0, s, 0.9, 0]);
    }
    for (let r = 0.05; r < 0.33; r += 0.07) {
      const n = Math.ceil(40 * r / 0.32);
      for (let i = 0; i < n; i++) { const a = i / n * TAU; P.push([Math.cos(a) * r, -1.4, Math.sin(a) * r, 0, -1, 0, 0.9, 0]); }
    }
    const a0 = 4.6, bx = Math.cos(a0), bz = Math.sin(a0), tx = -Math.sin(a0), tz = Math.cos(a0);
    for (let u = 0; u <= 0.95; u += 0.035) {
      for (let y = -0.55; y <= 0.4 - u * 0.3; y += 0.045) P.push([bx + tx * u, y, bz + tz * u, bx, 0, bz, 0.8, 1]);
    }
    return (this._cc = P);
  }

  cloudE() {
    if (this._ce) return this._ce;
    const m = this.textMask('E', 30, this.SANS, 800);
    const P = [], th = m.bot - m.top + 1, tw = m.right - m.left + 1, u = 2 / th, d = 0.3;
    const on = (x, y) => x >= 0 && y >= 0 && x < m.w && y < m.h && m.data[y * m.w + x] === 1;
    for (let y = m.top; y <= m.bot; y++) for (let x = m.left; x <= m.right; x++) {
      if (!on(x, y)) continue;
      const X = (x - m.left - (tw - 1) / 2) * u, Y = (y - m.top - (th - 1) / 2) * u;
      P.push([X, Y, -d, 0, 0, -1, 1, 0]);
      P.push([X, Y, d, 0, 0, 1, 0.7, 0]);
      for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
        if (on(x + dx, y + dy)) continue;
        for (let z = -d; z <= d; z += u * 0.8) P.push([X + dx * u / 2, Y + dy * u / 2, z, dx, dy, 0, 0.85, 0]);
      }
    }
    if (this.fontsOk) this._ce = P;
    return P;
  }

  fx_roll3d(S, lt) {
    const g = this.geo(S);
    const sc = Math.min(g.ih / 2.9 * 0.95, g.iw / 3.8) * (1 + 0.07 * this.B.pulse);
    this.render3d(S, this.cloudCanister(), lt * 2.1, 0.4 + 0.2 * Math.sin(lt * 1.2), sc, sc * 0.15,
      (p) => p[1] * 0.3 + lt * 0.4);
  }

  fx_e3d(S, lt) {
    const g = this.geo(S), n = this.B.n;
    this.render3d(S, this.cloudE(), lt * 2.6, 0.25 * Math.sin(lt * 1.6), Math.min(g.ih, g.iw * 1.3) / 2 * 0.85 * (1 + 0.08 * this.B.pulse), 0,
      (p, x) => n * 0.17 + x * 0.05);
  }

  fx_tunnel(S, lt) {
    const g = this.geo(S), TAU = Math.PI * 2, pulse = this.B.pulse;
    this.each(S, (x, y, o) => {
      const dx = (x - g.cx) / (g.iw / 2), dy = (y - g.cy) / (g.ih / 2);
      const d = S.shape === 'aperture' ? Math.hypot(dx, dy) : Math.max(Math.abs(dx), Math.abs(dy));
      const ph = Math.log(d + 0.04) * 2.4 - lt * 2.6 + Math.atan2(dy, dx) / TAU * 2;
      const k = Math.floor(ph), f = ph - k;
      o.v = (f < 0.42 ? 1 : 0.04) * (0.5 + 0.5 * pulse);
      o.c = k * 0.17;
    });
  }

  fx_equalizer(S, lt) {
    const g = this.geo(S), nb = Math.ceil(g.iw / 3), P = this.B.pulse;
    if (this.peaks.length !== nb) this.peaks = new Array(nb).fill(0);
    const hs = [];
    for (let k = 0; k < nb; k++) {
      const boost = k < nb / 3 ? P * 0.45 : P * 0.15;
      let h = 0.2 + 0.3 * Math.abs(Math.sin(k * 0.7 + lt * 6.3) * Math.sin(k * 0.23 - lt * 3.1)) + 0.25 * Math.abs(Math.sin(k * 1.9 + lt * 9.7)) + boost;
      h = Math.min(1, h) * g.ih;
      hs.push(h);
      this.peaks[k] = Math.max(h, this.peaks[k] - this.dt * g.ih * 0.9);
    }
    this.each(S, (x, y, o) => {
      const rx = x - g.x0;
      if (rx % 3 === 2) return;
      const k = Math.floor(rx / 3), fb = g.y0 + g.ih - 1 - y;
      if (fb < hs[k]) { o.v = 1; o.c = fb / g.ih * 0.83; }
      else if (fb === Math.round(this.peaks[k])) { o.v = 1; o.c = 0.9; }
    });
  }

  fx_iris(S, lt) {
    const g = this.geo(S), R = g.R;
    const f = 0.5 + 0.5 * Math.cos(lt * 2.6);
    const r = R * (0.12 + 0.78 * f), rot = (1 - f) * 1.1 + lt * 0.3;
    const holeC = this.B.n * 0.17, holeV = 0.7 + 0.3 * this.B.pulse;
    const N = [];
    for (let k = 0; k < 6; k++) { const a = rot + k * Math.PI / 3; N.push([Math.cos(a), Math.sin(a)]); }
    this.each(S, (x, y, o) => {
      const px = x - g.cx, py = y - g.cy, d = Math.hypot(px, py);
      if (d > R + 0.3) { o.v = 0.04; return; }
      if (Math.abs(d - R) < 0.7) { o.v = 0.6; return; }
      let hd = -1e9;
      for (const n of N) hd = Math.max(hd, px * n[0] + py * n[1]);
      if (hd < r) { o.v = holeV; o.c = holeC; return; }
      o.c = holeC + 0.5;
      for (const n of N) {
        if (Math.abs(px * n[0] + py * n[1] - r) < 0.55 && (-px * n[1] + py * n[0]) > r * 0.577) { o.v = 0.8; return; }
      }
      o.v = 0.12;
    });
  }

  fx_kaleido(S, lt) {
    const g = this.geo(S), seg = Math.PI / 3, P = this.B.pulse;
    this.each(S, (x, y, o) => {
      const dx = x - g.cx, dy = y - g.cy, r = Math.hypot(dx, dy) / g.R;
      let a = Math.atan2(dy, dx) + lt * 0.6;
      a = ((a % seg) + seg) % seg;
      const af = Math.abs(a - seg / 2);
      const val = Math.sin(r * 10 - lt * 5 + Math.sin(af * 6 + lt * 1.7) * 2.5);
      o.v = (val > 0.25 ? 1 : val > -0.35 ? 0.2 : 0.03) * (0.55 + 0.45 * P);
      o.c = r * 0.9 + lt * 0.3 + af * 0.4;
    });
  }

  fx_filmstrip(S, lt) {
    const g = this.geo(S), vert = S.gh > S.gw * 1.2, P = this.B.pulse;
    const A = vert ? g.iw : g.ih;
    const sh = Math.round(A * 0.82), fw = Math.round(sh * 1.25), a0 = Math.round((A - sh) / 2);
    const bw = Math.max(3, Math.round(sh * 0.16));
    const pos = 10 * lt + 2.4 * lt * lt * lt;
    this.each(S, (x, y, o) => {
      const u = vert ? y - g.y0 : x - g.x0, q = (vert ? x - g.x0 : y - g.y0) - a0;
      if (q < 0 || q >= sh) return;
      const s = u + pos;
      if (q < bw || q >= sh - bw) {
        const inner = (q > 0 && q < bw - 1) || (q > sh - bw && q < sh - 1);
        o.v = inner && ((Math.floor(s) % 5) + 5) % 5 < 2 ? 0 : 0.85;
        return;
      }
      const fr = ((s % fw) + fw) % fw, fi = Math.floor(s / fw);
      if (fr < 1.5) return;
      o.c = fi * 0.17;
      o.v = Math.hypot(fr - fw / 2, q - sh / 2) < sh * 0.2 ? 0.7 + 0.3 * P : 0.18;
    });
  }

  fx_lightleak(S, lt) {
    const g = this.geo(S);
    this.each(S, (x, y, o) => {
      const v0 = Math.sin(x * 0.23 + lt * 1.8) + Math.sin(y * 0.19 - lt * 1.4) + Math.sin((x + y) * 0.12 + lt * 1.0) + Math.sin(Math.hypot(x - g.cx, y - g.cy) * 0.35 - lt * 3);
      const v = Math.pow((v0 + 4) / 8, 2.2) * 1.5;
      o.v = Math.min(1, Math.floor(v * 5) / 5);
      o.c = v0 * 0.12 + lt * 0.15;
    });
  }

  fx_burst(S, lt) {
    const g = this.geo(S), B = this.B;
    if (lt < 0.05) this.parts = [];
    if (B.n !== this.lastBeat) {
      this.lastBeat = B.n;
      const cx = g.cx + (Math.random() - 0.5) * g.iw * 0.5, cy = g.cy + (Math.random() - 0.5) * g.ih * 0.4;
      const col = Math.floor(Math.random() * 6) / 6;
      for (let k = 0; k < 46; k++) {
        const a = Math.random() * Math.PI * 2, sp = 8 + Math.random() * 26;
        this.parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, c: col + Math.random() * 0.15 });
      }
    }
    const dt = this.dt;
    this.parts = this.parts.filter((p) => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 14 * dt; p.vx *= 0.985; p.life -= dt * 1.1;
      if (p.life <= 0) return false;
      this.put(S, Math.round(p.x), Math.round(p.y), p.life, p.c);
      return true;
    });
  }

  fx_clock(S, lt, d) {
    const g = this.geo(S);
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0'), mm = String(now.getMinutes()).padStart(2, '0');
    const narrow = g.iw < 40, first = lt < d / 2;
    const lines = first ? (narrow ? ['OP', 'EN'] : ['OPEN']) : (narrow ? [hh, mm] : [hh + ':' + mm]);
    const px = narrow ? Math.round(Math.min(g.ih * 0.4, g.iw * 0.62)) : Math.round(Math.min(g.ih * 0.68, g.iw / (first ? 2.9 : 2.7)));
    const gap = Math.round(px * 0.18);
    const ms = lines.map((s) => this.textMask(s, px, this.SANS, 700));
    const hs = ms.map((m) => m.bot - m.top + 1);
    let y = g.cy - (hs.reduce((a, b) => a + b, 0) + gap * (ms.length - 1) - 1) / 2;
    ms.forEach((m, k) => { this.stampC(S, m, g.cx, y + (hs[k] - 1) / 2, 1, 0); y += hs[k] + gap; });
  }

  fx_strobe(S, lt) {
    if (((lt * 2.5) % 1) >= 0.4) return;
    const c = Math.floor(lt * 2.5) * 0.17 + 0.5;
    for (let i = 0; i < S.buf.length; i++) if (S.mask[i]) { S.buf[i] = 1; S.col[i] = c; }
  }

  draw(ctx, W, H, dpr, S) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, H);
    const wallW = 96;
    const p = Math.min((W - wallW - 150) / S.gw, (H - 330) / S.gh, 12);
    const sw = S.gw * p, sh = S.gh * p;
    const sx = Math.round(wallW + (W - wallW - sw) / 2 + 10), sy = Math.round((H - sh) / 2 + 40);
    const lut = this.lut, NS = lut.length;

    const levels = 12, bins = [];
    let sv = 0, sr = 0, sg = 0, sbl = 0, n = 0;
    for (let i = 0; i < S.buf.length; i++) {
      if (!S.mask[i]) continue;
      const v = Math.min(1, S.buf[i]);
      const st = ((Math.floor(S.col[i] * NS) % NS) + NS) % NS;
      const key = Math.round(v * levels) * NS + st;
      (bins[key] || (bins[key] = [])).push(i);
      const rgb = lut[st];
      sv += v; sr += rgb[0] * v; sg += rgb[1] * v; sbl += rgb[2] * v; n++;
    }
    const avg = sv / n;
    const sc = sv > 0 ? [sr / sv, sg / sv, sbl / sv].map(Math.round).join(',') : '246,133,61';

    const gx = sx + sw / 2, gy = sy + sh / 2;
    const gr = ctx.createRadialGradient(gx, gy, 0, gx, gy, 640);
    gr.addColorStop(0, 'rgba(' + sc + ',' + (0.04 + avg * 0.34).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(' + sc + ',0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(72,72,72,0.35)'; ctx.fillRect(0, 0, wallW, H);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, wallW, H);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    for (let y = 30; y < H; y += 34) ctx.fillRect(0, y, wallW, 2);
    ctx.fillRect(wallW - 2, 0, 2, H);

    const armY = sy - 64;
    ctx.fillStyle = '#484848';
    ctx.fillRect(wallW - 6, armY - 34, 14, 84);
    ctx.fillRect(wallW, armY, sx + sw * 0.86 - wallW, 9);
    ctx.strokeStyle = '#484848'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(wallW + 4, armY + 46); ctx.lineTo(wallW + 110, armY + 6); ctx.stroke();
    for (const f of [0.18, 0.82]) {
      const cx = Math.floor(S.gw * f);
      let top = 0;
      while (top < S.gh && !S.mask[top * S.gw + cx]) top++;
      const hx = sx + (cx + 0.5) * p;
      ctx.fillRect(hx - 2, armY + 9, 4, sy + top * p - 9 - (armY + 9));
    }

    if (!S.housing || S.hp !== p || S.hd !== dpr) {
      const pad = 12, hc = document.createElement('canvas');
      hc.width = Math.ceil((sw + pad * 2) * dpr); hc.height = Math.ceil((sh + pad * 2) * dpr);
      const h = hc.getContext('2d');
      h.setTransform(dpr, 0, 0, dpr, 0, 0);
      const layer = (e, col) => {
        h.fillStyle = col;
        for (let y = 0; y < S.gh; y++) for (let x = 0; x < S.gw; x++) {
          if (S.mask[y * S.gw + x]) h.fillRect(pad + x * p - e, pad + y * p - e, p + 2 * e, p + 2 * e);
        }
      };
      layer(9, '#484848'); layer(7, '#000000');
      const lc = document.createElement('canvas');
      lc.width = Math.ceil(sw * dpr); lc.height = Math.ceil(sh * dpr);
      S.housing = hc; S.led = lc; S.hp = p; S.hd = dpr; S.pad = pad;
    }
    ctx.drawImage(S.housing, sx - S.pad, sy - S.pad, sw + S.pad * 2, sh + S.pad * 2);

    const l = S.led.getContext('2d');
    l.setTransform(dpr, 0, 0, dpr, 0, 0);
    l.clearRect(0, 0, sw, sh);
    const r = p * 0.36, TAU = Math.PI * 2;
    for (const key in bins) {
      const k = Math.floor(key / NS), rgb = lut[key % NS];
      l.fillStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + (0.1 + 0.9 * k / levels).toFixed(3) + ')';
      l.beginPath();
      for (const i of bins[key]) {
        const x = (i % S.gw + 0.5) * p, y = (Math.floor(i / S.gw) + 0.5) * p;
        l.moveTo(x + r, y); l.arc(x, y, r, 0, TAU);
      }
      l.fill();
    }
    ctx.drawImage(S.led, sx, sy, sw, sh);
    if (this.props.glow ?? true) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.filter = 'blur(' + (p * 0.8 * dpr).toFixed(1) + 'px)'; ctx.globalAlpha = 0.7;
      ctx.drawImage(S.led, sx, sy, sw, sh);
      ctx.filter = 'blur(' + (p * 2.6 * dpr).toFixed(1) + 'px)'; ctx.globalAlpha = 0.45;
      ctx.drawImage(S.led, sx, sy, sw, sh);
      ctx.restore();
    }
  }
}
</script>
